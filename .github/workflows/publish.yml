name: Publish to TikTok
on:
  schedule:
    - cron: "0 15 * * *"   # UTC time. Change to your schedule.
  workflow_dispatch:
permissions:
  contents: write
concurrency: autopost
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next video from queue
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python3 scripts/tiktok.py publish
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state queue posted
          git diff --cached --quiet || (git commit -m "Autopost: update queue and token" && git push)
